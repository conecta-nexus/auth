name: Close Issues on Merge to Develop

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close all referenced issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prBody = pr.body || "";

            // Match closing keywords: Closes #12, Fixes conecta-nexus/auth#12, Resolves #12, etc.
            const closingRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:([a-zA-Z0-9_.-]+)\/([a-zA-Z0-9_.-]+))?#(\d+)/gi;

            const targets = [];
            let match;
            while ((match = closingRegex.exec(prBody)) !== null) {
              const owner = match[1] || context.repo.owner;
              const repo = match[2] || context.repo.repo;
              const issueNumber = parseInt(match[3], 10);
              targets.push({ owner, repo, issueNumber });
            }

            if (targets.length === 0) {
              console.log("No closing keywords found in PR description.");
              return;
            }

            // Deduplicate
            const uniqueTargets = Array.from(
              new Map(targets.map(item => [`${item.owner}/${item.repo}#${item.issueNumber}`, item])).values()
            );

            for (const { owner, repo, issueNumber } of uniqueTargets) {
              try {
                console.log(`Closing issue ${owner}/${repo}#${issueNumber}...`);

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: "closed",
                  state_reason: "completed"
                });

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: `Automated: Closed by merge of PR #${pr.number} (\`${pr.title}\`) into \`develop\`.`
                });

                console.log(`Successfully closed #${issueNumber}.`);
              } catch (error) {
                console.error(`Failed to close issue ${owner}/${repo}#${issueNumber}:`, error.message);
              }
            }
